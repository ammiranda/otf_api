version: 2

project_name: otf-cli

builds:
  - id: otf-cli
    main: ./cmd/otf-cli
    binary: otf-cli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}

checksum:
  name_template: 'checksums-cli.txt'

changelog:
  skip: true

release:
  github:
    owner: ammiranda
    name: otf_api
  mode: append
  draft: false
  prerelease: auto
