name: Release

on:
  push:
    tags:
      - 'v*'
      - 'cmd/*/v*'

permissions:
  contents: write

jobs:
  sdk:
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build and test SDK
        run: |
          go test -count=1 ./...
          go vet ./...

      - name: Generate release notes
        id: notes
        run: |
          VER="${GITHUB_REF_NAME#v}"
          echo "title=otf_api v$VER" >> "$GITHUB_OUTPUT"
          echo "notes=## otf_api v$VER\n\nGo SDK for the OrangeTheory Fitness API." >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.notes.outputs.title }}
          body: ${{ steps.notes.outputs.notes }}

  cli:
    if: startsWith(github.ref_name, 'cmd/otf-cli/')
    needs: []
    runs-on: ubuntu-latest
    steps:
      - name: Wait for release to exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${GITHUB_REF_NAME#cmd/otf-cli/v}"
          echo "Waiting for release $TAG to be created..."
          for i in $(seq 1 30); do
            if gh release view "$TAG" > /dev/null 2>&1; then
              echo "Release $TAG found"
              exit 0
            fi
            echo "Attempt $i/30: release not found yet, waiting 10s..."
            sleep 10
          done
          echo "Timeout waiting for release $TAG"
          exit 1

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Determine version
        id: version
        run: echo "value=${GITHUB_REF_NAME#cmd/otf-cli/v}" >> "$GITHUB_OUTPUT"

      - name: Release CLI
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --config .goreleaser/cli.yaml --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GORELEASER_CURRENT_TAG: v${{ steps.version.outputs.value }}

  mcp:
    if: startsWith(github.ref_name, 'cmd/otf-mcp/')
    needs: []
    runs-on: ubuntu-latest
    steps:
      - name: Wait for release to exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${GITHUB_REF_NAME#cmd/otf-mcp/v}"
          echo "Waiting for release $TAG to be created..."
          for i in $(seq 1 30); do
            if gh release view "$TAG" > /dev/null 2>&1; then
              echo "Release $TAG found"
              exit 0
            fi
            echo "Attempt $i/30: release not found yet, waiting 10s..."
            sleep 10
          done
          echo "Timeout waiting for release $TAG"
          exit 1

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Determine version
        id: version
        run: echo "value=${GITHUB_REF_NAME#cmd/otf-mcp/v}" >> "$GITHUB_OUTPUT"

      - name: Release MCP
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --config .goreleaser/mcp.yaml --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GORELEASER_CURRENT_TAG: v${{ steps.version.outputs.value }}
